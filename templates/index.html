<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time People Analytics & Counter</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.7);
            --border-card: rgba(255, 255, 255, 0.08);
            --accent-green: #10b981;
            --accent-red: #f43f5e;
            --accent-blue: #3b82f6;
            --accent-cyan: #06b6d4;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.1) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 1.25rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-card);
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.2rem;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .logo-text h1 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .logo-text p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .status-badge {
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-green);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        main {
            padding: 2rem;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 1.5rem;
            flex: 1;
        }

        .video-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 16px;
            overflow: hidden;
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .card-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border-card);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .video-container {
            position: relative;
            width: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 480px;
        }

        .video-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            max-height: 650px;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 16px;
            padding: 1.25rem 1.5rem;
            backdrop-filter: blur(12px);
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
        }

        .stat-card.enter::before { background: var(--accent-green); }
        .stat-card.exit::before { background: var(--accent-red); }
        .stat-card.inside::before { background: var(--accent-cyan); }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .stat-value {
            font-size: 2.25rem;
            font-weight: 700;
            letter-spacing: -0.03em;
        }

        .stat-card.enter .stat-value { color: var(--accent-green); }
        .stat-card.exit .stat-value { color: var(--accent-red); }
        .stat-card.inside .stat-value { color: var(--accent-cyan); }

        .config-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 16px;
            padding: 1.5rem;
            backdrop-filter: blur(12px);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-card);
            border-radius: 8px;
            padding: 0.65rem 0.85rem;
            color: var(--text-main);
            font-size: 0.85rem;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .btn-save {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-blue), #2563eb);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0.75rem;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-save:hover {
            opacity: 0.9;
        }

        @media (max-width: 1024px) {
            main {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <div class="logo-icon">
                <i class="fa-solid fa-users-viewfinder"></i>
            </div>
            <div class="logo-text">
                <h1>People Counter & Video Analytics</h1>
                <p>Real-Time Deep Learning Stream Processor</p>
            </div>
        </div>
        <div class="status-badge">
            <span class="status-dot"></span>
            <span id="system-status">Live Monitoring</span>
        </div>
    </header>

    <main>
        <div class="video-card">
            <div class="card-header">
                <div class="card-title">
                    <i class="fa-solid fa-video" style="color: var(--accent-cyan);"></i>
                    Live Camera Feed
                </div>
                <span style="font-size: 0.85rem; color: var(--text-muted);" id="fps-display">FPS: 0.0</span>
            </div>
            <div class="video-container">
                <img src="/video_feed" alt="Live Stream">
            </div>
        </div>

        <div class="sidebar">
            <div class="stat-card exit">
                <div class="stat-label">
                    <span>PEOPLE LEAVING (EXIT)</span>
                    <i class="fa-solid fa-person-walking-arrow-right"></i>
                </div>
                <div class="stat-value" id="val-exit">0</div>
            </div>

            <div class="stat-card enter">
                <div class="stat-label">
                    <span>PEOPLE ENTERING (ENTER)</span>
                    <i class="fa-solid fa-person-walking-arrow-loop-left"></i>
                </div>
                <div class="stat-value" id="val-enter">0</div>
            </div>

            <div class="stat-card inside">
                <div class="stat-label">
                    <span>TOTAL INSIDE</span>
                    <i class="fa-solid fa-building-user"></i>
                </div>
                <div class="stat-value" id="val-inside">0</div>
            </div>

            <div class="config-card">
                <h3 style="font-size: 0.95rem; font-weight: 600; margin-bottom: 1rem;">
                    <i class="fa-solid fa-gear" style="color: var(--accent-blue); margin-right: 0.4rem;"></i>
                    Stream Settings
                </h3>
                <div class="form-group">
                    <label>RTSP / Video Stream URL</label>
                    <input type="text" id="cfg-url" class="form-control" placeholder="rtsp://...">
                </div>
                <button class="btn-save" onclick="saveConfig()">Save & Apply Settings</button>
            </div>
        </div>
    </main>

    <script>
        async function fetchStats() {
            try {
                const res = await fetch('/api/stats');
                const data = await res.json();
                document.getElementById('val-exit').innerText = data.total_exit;
                document.getElementById('val-enter').innerText = data.total_enter;
                document.getElementById('val-inside').innerText = data.inside;
                document.getElementById('fps-display').innerText = `FPS: ${data.fps}`;
            } catch (err) {
                console.error("Error fetching stats:", err);
            }
        }

        async function loadConfig() {
            try {
                const res = await fetch('/api/config');
                const cfg = await res.json();
                document.getElementById('cfg-url').value = cfg.url || '';
            } catch (err) {
                console.error("Error loading config:", err);
            }
        }

        async function saveConfig() {
            const url = document.getElementById('cfg-url').value;
            const res = await fetch('/api/config');
            const cfg = await res.json();
            cfg.url = url;

            await fetch('/api/config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(cfg)
            });
            alert('Settings saved successfully! Reloading stream...');
            window.location.reload();
        }

        setInterval(fetchStats, 1000);
        loadConfig();
    </script>
</body>
</html>
